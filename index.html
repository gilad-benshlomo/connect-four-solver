<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#EEF2F9" />
    <meta name="description" content="Play Connect Four against a computer that never makes a mistake. You can win, but only with a perfect game. How far can you get?" />
    <title>Connect Four against a perfect solver</title>

    <!-- The card shown when the link is shared (LinkedIn, WhatsApp, Facebook, X). Crawlers do not run scripts, so these stay in English whatever language the page starts in. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://gilad-benshlomo.github.io/connect-four-solver/" />
    <meta property="og:title" content="Connect Four against a perfect solver" />
    <meta property="og:description" content="Play Connect Four against a computer that never makes a mistake. You can win, but only with a perfect game. How far can you get?" />
    <!-- ?v= changes with every new image: sites keep images by their address, and a new address makes them fetch it again. -->
    <meta property="og:image" content="https://gilad-benshlomo.github.io/connect-four-solver/og-image.png?v=2" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A Connect Four board in the middle of a game, next to the title: Connect Four, you against a perfect solver. How far can you get?" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
    <!-- Counts visits and the game events sent by src/ui/analytics.ts (D35): no cookies, nothing that identifies a person. -->
    <script data-goatcounter="https://connect-four-gilad.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
  </body>
</html>
